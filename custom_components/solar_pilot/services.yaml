activate:
  name: Steuerung aktivieren
  description: Aktiviert die Strommanager-Gerätesteuerung nach Prüfung der steuerbaren Entitäten.
  fields:
    entry_id:
      required: true
      selector:
        text:
    mode:
      default: auto
      selector:
        select:
          options: [auto, storage_first, charge_minimum]
evaluate:
  name: Neu berechnen
  description: Berechnet neu. Im aktiven Modus werden bei Bedarf Gerätebefehle gesendet.
  fields:
    entry_id:
      required: true
      selector:
        text:
set_mode:
  name: Betriebsmodus setzen
  fields:
    entry_id:
      required: true
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          options: [observe, auto, storage_first, charge_minimum, paused]
configure:
  name: Einstellungen ändern
  fields:
    entry_id:
      required: true
      selector:
        text:
    settings:
      required: true
      selector:
        object:

import_consumption_history:
  name: Verbrauchshistorie weiter importieren
  description: Setzt den lesenden InfluxDB-v1-Import fort. Ändert keine Geräte oder Quelldaten.
  fields:
    entry_id:
      required: true
      selector:
        text:

configure_sources:
  name: Entitäten zuordnen
  description: Speichert Regelungs-, Prognose- und Anzeigequellen. Lädt die Integration neu.
  fields:
    entry_id:
      required: true
      selector:
        text:
    sources:
      required: true
      selector:
        object:
